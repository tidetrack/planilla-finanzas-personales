/**
 * Agrega un bloque heredando del anterior lo que casi siempre se repite.
 * Se hereda MEDIO, FECHA y TIPO; nunca monto, cuenta ni nota. Cuando se cargan seis gastos de
 * una sentada el medio y el dia son los mismos y el resto cambia siempre: heredar lo que
 * cambia obliga a borrarlo, que es peor que tipearlo.
 */
function agregarBloqueMovimiento() {
    if (!catalogo) { avisoSinCatalogo(); return; }
    var lista = document.getElementById('movLista');
    var previos = lista.querySelectorAll('.bloque');
    if (previos.length >= cupoMaximo()) return;

    var heredaMedio = medioPorDefecto(), heredaFecha = hoyISO(), heredaTipo = 'Egreso';
    if (previos.length) {
        var ult = previos[previos.length - 1];
        heredaMedio = ult.querySelector('.b-medio').value;
        heredaFecha = ult.querySelector('.b-fecha').value;
        heredaTipo = ult.querySelector('.b-tipo').value;
        resumirBloque(ult);
        ult.dataset.estado = 'resumen';
    }

    var envoltorio = document.createElement('div');
    envoltorio.innerHTML = PLANTILLA_BLOQUE;
    var div = envoltorio.firstElementChild;
    lista.appendChild(div);

    // Los select se pueblan DESPUES de insertar: un value interpolado en el HTML de un select
    // no selecciona nada.
    // Los datalist ya estan poblados y son compartidos: el bloque solo los referencia.
    div.querySelector('.b-medio').value = heredaMedio;
    vigilarCombo(div.querySelector('.b-cuenta'), todasLasCuentas());
    vigilarCombo(div.querySelector('.b-medio'), nombresDeMedio());
    llenarSelect(div.querySelector('.b-moneda'), [{ items: catalogo.monedas }]);
    div.querySelector('.b-fecha').value = heredaFecha;
    div.querySelector('.b-tipo').value = heredaTipo;
    div.dataset.tipo = heredaTipo;
    div.querySelectorAll('.seg button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.v === heredaTipo));
    });
    div.querySelector('.b-medio').onchange = function () { monedaDelMedio(div); };
    div.querySelector('.b-monto').oninput = actualizarTotal;
    div.querySelector('.b-moneda').onchange = function () {
        div.querySelector('.b-pref').textContent = div.querySelector('.b-moneda').value;
        actualizarTotal();
    };
    monedaDelMedio(div);

    renumerarBloques();
    actualizarCupo();
    actualizarTotal();
    div.querySelector('.b-monto').focus();
}

function quitarBloqueMovimiento(btn) {
    var lista = document.getElementById('movLista');
    if (lista.querySelectorAll('.bloque').length <= 1) return;
    btn.closest('.bloque').remove();
    renumerarBloques();
    actualizarCupo();
    actualizarTotal();
}

/** El numero va DENTRO de la pastilla, y el boton de quitar desaparece si hay uno solo. */
function renumerarBloques() {
    var bs = document.querySelectorAll('#movLista .bloque');
    bs.forEach(function (b, i) {
        b.querySelector('.bloque-num .n').textContent = (i + 1);
        b.querySelector('.btn-quitar').style.visibility = bs.length > 1 ? 'visible' : 'hidden';
    });
}

/**
 * El medio con el que arranca un bloque nuevo.
 *
 * Sin esto quedaba el PRIMERO DEL CATALOGO, que esta ordenado alfabeticamente: "Dolar Cash".
 * O sea que cada movimiento nuevo nacia en DOLARES, y el prefijo del monto decia USD, cuando
 * diez de los quince medios son ARS y todos los cotidianos tambien. Un default que casi
 * siempre esta mal es peor que no tener default: obliga a corregirlo todas las veces, y el
 * dia que no se corrige entra un gasto en la moneda equivocada.
 *
 * La regla es el primer medio en la MONEDA BASE, que es la primera de MONEDAS_DISPONIBLES
 * (ADR-003: ARS es la base, siempre 1.0). No se retipea "ARS" aca.
 */
function medioPorDefecto() {
    if (!catalogo || !catalogo.medios || !catalogo.medios.length) return '';
    var base = (catalogo.monedas || [])[0];
    var enBase = catalogo.medios.filter(function (m) { return m.moneda === base; })[0];
    return (enBase || catalogo.medios[0]).nombre;
}

/** La altura de la grilla de Cargas, que es lo que define el tamano de cada tanda. */
function filasDeGrilla() {
    return (catalogo && typeof catalogo.filasGrilla === 'number') ? catalogo.filasGrilla : 15;
}

/**
 * El tope de bloques.
 *
 * decision Franco 2026-08-25: "deberia dejar cargar muchos mas movimientos, no solo 15". Ya no
 * corta la grilla: el backend procesa en TANDAS. Lo que queda como limite es el tiempo -- cada
 * tanda es un procesarCargas con su pasada de cotizaciones, y Apps Script mata a los 6
 * minutos. CUPO_BLOQUES es un techo de seguridad holgado, no la altura de la grilla; el
 * usuario ve cuantas tandas va a costar antes de apretar Cargar.
 */
var CUPO_BLOQUES = 60;
function cupoMaximo() { return CUPO_BLOQUES; }

function actualizarCupo() {
    var n = document.querySelectorAll('#movLista .bloque').length;
    var tandas = Math.ceil(n / filasDeGrilla());
    document.getElementById('movAgregar').disabled = n >= CUPO_BLOQUES;
    document.getElementById('movCupo').textContent = n >= CUPO_BLOQUES
        ? 'Llegaste al tope de ' + CUPO_BLOQUES + ' por carga. Guarda estos y segui.'
        : n + ' movimiento' + (n === 1 ? '' : 's') +
          (tandas > 1 ? '. Se procesan en ' + tandas + ' tandas.' : '. Se cargan todos juntos.');
}

/** El total del lote, solo si todo comparte moneda: sumar monedas distintas seria mentir. */
function actualizarTotal() {
    var total = 0, monedas = {}, hay = false;
    document.querySelectorAll('#movLista .bloque').forEach(function (b) {
        var m = aNumero(b.querySelector('.b-monto').value);
        if (m === '' || !m) return;
        hay = true;
        total += (b.querySelector('.b-tipo').value === 'Ingreso' ? m : -m);
        monedas[b.querySelector('.b-moneda').value] = true;
    });
    var caja = document.getElementById('movTotal');
    if (!hay) { caja.textContent = '\u2014'; caja.dataset.signo = ''; return; }
    var claves = Object.keys(monedas);
    if (claves.length > 1) { caja.textContent = 'varias monedas'; caja.dataset.signo = ''; return; }
    caja.dataset.signo = total < 0 ? 'neg' : 'pos';
    caja.textContent = (total < 0 ? '-' : '+') +
        Math.abs(total).toFixed(2).replace('.', ',') + ' ' + claves[0];
}

/** La moneda la decide el CATALOGO, igual que hace el onEdit de la hoja de Cargas. */
function monedaDelMedio(div) {
    var medio = div.querySelector('.b-medio').value;
    var m = (catalogo.medios || []).filter(function (x) { return x.nombre === medio; })[0];
    if (m && m.moneda) div.querySelector('.b-moneda').value = m.moneda;
    div.querySelector('.b-pref').textContent = div.querySelector('.b-moneda').value;
    actualizarTotal();
}

function guardarMovimientos() {
    var lista = [];
    document.querySelectorAll('#movLista .bloque').forEach(function (b) {
        lista.push({
            monto: aNumero(b.querySelector('.b-monto').value),
            tipo: b.querySelector('.b-tipo').value,
            cuenta: b.querySelector('.b-cuenta').value,
            medio: b.querySelector('.b-medio').value,
            moneda: b.querySelector('.b-moneda').value,
            fecha: b.querySelector('.b-fecha').value,
            nota: b.querySelector('.b-nota').value
        });
    });
    // El catalogo NO se invalida al guardar: nada de lo que el cliente consume cambio (el
    // backend escribe en la grilla, el ledger y los bloques TC, nunca en el Plan de Cuentas;
    // el ABM reemplaza el modal entero, asi que sus cambios llegan con catalogo nuevo).
    enviar('registrarMovimientos', lista, ['movBtnGuardar'], function () {
        document.getElementById('movLista').innerHTML = '';
        irAVista('home');
    });
}

// ============================================
// TRASPASO -- carga multiple, igual que Movimiento
// ============================================
//
// decision Franco 2026-08-25: "los traspasos no tienen interfaz disenada como la de
// movimientos. Debe ser una tarjeta y se deberian poder cargar varios". Era un formulario
// suelto de una sola operacion mientras al lado habia bloques repetibles con acordeon: dos
// gramaticas distintas para el mismo acto de cargar. Ahora comparten la misma.

var PLANTILLA_TRASPASO =
        '<div class="bloque bloque--nuevo" data-estado="edicion">' +

function prepararTraspaso() {
    if (!document.querySelectorAll('#trasLista .bloque').length) {
        agregarBloqueTraspaso();
    }
    actualizarCupoTraspaso();
}

function agregarBloqueTraspaso() {
    if (!catalogo) { avisoSinCatalogo(); return; }
    var lista = document.getElementById('trasLista');
    var previos = lista.querySelectorAll('.bloque');
    var medios = nombresDeMedio();

    var heredaFecha = hoyISO();
    if (previos.length) {
        var ult = previos[previos.length - 1];
        heredaFecha = ult.querySelector('.t-fecha').value;
        resumirTraspaso(ult);
        ult.dataset.estado = 'resumen';
    }

    var env = document.createElement('div');
    env.innerHTML = PLANTILLA_TRASPASO;
    var div = env.firstElementChild;
    lista.appendChild(div);

    // Se propone origen y destino distintos, no el mismo dos veces: el mismo origen y destino
    // es el unico traspaso que nunca es valido.
    div.querySelector('.t-origen').value = medioPorDefecto();
    var otro = medios.filter(function (m) { return m !== medioPorDefecto(); })[0] || '';
    div.querySelector('.t-destino').value = otro;
    div.querySelector('.t-fecha').value = heredaFecha;

    vigilarCombo(div.querySelector('.t-origen'), medios);
    vigilarCombo(div.querySelector('.t-destino'), medios);
    ['.t-origen', '.t-destino'].forEach(function (sel) {
        div.querySelector(sel).addEventListener('change', function () { monedasTraspaso(div); });
    });
    ['.t-montoO', '.t-montoD'].forEach(function (sel) {
        div.querySelector(sel).addEventListener('input', function () { tipoDeCambio(div); });
    });
    monedasTraspaso(div);

    renumerarTraspasos();
    actualizarCupoTraspaso();
    div.querySelector('.t-montoO').focus();
}

function quitarBloqueTraspaso(btn) {
    var lista = document.getElementById('trasLista');
    if (lista.querySelectorAll('.bloque').length <= 1) return;
    btn.closest('.bloque').remove();
    renumerarTraspasos();
    actualizarCupoTraspaso();
}

function abrirBloqueTraspaso(el) {
    var b = el.closest('.bloque');
    document.querySelectorAll('#trasLista .bloque').forEach(function (o) {
        if (o !== b) { resumirTraspaso(o); o.dataset.estado = 'resumen'; }
    });
    b.dataset.estado = 'edicion';
    b.querySelector('.t-montoO').focus();
}

function resumirTraspaso(b) {
    var v = function (s) { var e = b.querySelector(s); return e ? e.value : ''; };
    var o = v('.t-origen'), d = v('.t-destino');
    var monto = aNumero(v('.t-montoO'));
    var f = v('.t-fecha');
    b.querySelector('.bloque-cuenta').textContent = (o && d) ? (o + ' a ' + d) : 'Sin definir';
    b.querySelector('.bloque-meta').textContent = f ? f.slice(8) + '/' + f.slice(5, 7) : '';
    var caja = b.querySelector('.bloque-monto');
    caja.dataset.vacio = monto ? '0' : '1';
    caja.innerHTML = (monto ? escapar(monto.toFixed(2).replace('.', ','))
                            : '\u2014') + '<span class="u">' + escapar(monedaDe(o)) + '</span>';
}

function renumerarTraspasos() {
    var bs = document.querySelectorAll('#trasLista .bloque');
    bs.forEach(function (b, i) {
        b.querySelector('.bloque-num .n').textContent = (i + 1);
        b.querySelector('.btn-quitar').style.visibility = bs.length > 1 ? 'visible' : 'hidden';
    });
}

function actualizarCupoTraspaso() {
    var n = document.querySelectorAll('#trasLista .bloque').length;
    var tandas = Math.ceil((n * 2) / filasDeGrilla());
    document.getElementById('trasCupo').textContent = n + ' traspaso' + (n === 1 ? '' : 's') +
        '. Cada uno son dos filas' + (tandas > 1 ? ', y se procesan en ' + tandas + ' tandas.' : '.');
}

function monedaDe(n) {
    var m = ((catalogo && catalogo.medios) || []).filter(function (x) { return x.nombre === n; })[0];
    return m ? m.moneda : '';
}
function tipoDe(n) {
    var m = ((catalogo && catalogo.medios) || []).filter(function (x) { return x.nombre === n; })[0];
    return m ? m.tipo : '';
}

/**
 * El segundo monto aparece SOLO si las cajas no comparten moneda. Cuando la comparten, pedirlo
 * seria pedir un dato que ya se sabe, y dejar que se tipee distinto es dejar que un traspaso
 * invente o destruya plata.
 */
function monedasTraspaso(div) {
    var o = div.querySelector('.t-origen').value;
    var d = div.querySelector('.t-destino').value;
    var mo = monedaDe(o), md = monedaDe(d);
    div.querySelector('.t-prefO').textContent = mo;
    div.querySelector('.t-prefD').textContent = md;
    var cruza = mo && md && mo !== md;
    div.querySelector('.t-campoD').classList.toggle('hidden', !cruza);
    div.querySelector('.t-hintD').textContent = cruza ? md + ', porque cruza moneda' : '';

    var aviso = 'Se escriben dos filas con la cuenta Traspaso: una que sale y una que entra.';
    if (o && d && o === d) aviso = 'El origen y el destino son la misma caja.';
    else if (TIPOS_RIQUEZA_CLIENTE.indexOf(tipoDe(d)) !== -1) {
        aviso += ' Este capitaliza: la plata pasa a una caja de ' + tipoDe(d) + '.';
    }
    div.querySelector('.t-aviso').textContent = aviso;
    tipoDeCambio(div);
}

/** Muestra el TC implicito mientras se tipea: es el dato que el ledger no va a guardar. */
function tipoDeCambio(div) {
    if (div.querySelector('.t-campoD').classList.contains('hidden')) return;
    var a = aNumero(div.querySelector('.t-montoO').value);
    var b = aNumero(div.querySelector('.t-montoD').value);
    var md = monedaDe(div.querySelector('.t-destino').value);
    var hint = div.querySelector('.t-hintD');
    if (a && b) {
        hint.textContent = md + '. Tipo de cambio de la operacion: ' +
            (Math.round((a / b) * 100) / 100).toString().replace('.', ',');
    } else if (md) {
        hint.textContent = md + ', porque cruza moneda';
    }
}

function guardarTraspasos() {
    var lista = [];
    document.querySelectorAll('#trasLista .bloque').forEach(function (b) {
        lista.push({
            origen: b.querySelector('.t-origen').value,
            destino: b.querySelector('.t-destino').value,
            montoOrigen: aNumero(b.querySelector('.t-montoO').value),
            montoDestino: aNumero(b.querySelector('.t-montoD').value),
            fecha: b.querySelector('.t-fecha').value,
            nota: b.querySelector('.t-nota').value
        });
    });
    enviar('registrarTraspasos', lista, ['trasBtnGuardar'], function () {
        document.getElementById('trasLista').innerHTML = '';
        irAVista('home');
    });
}

/** 'YYYY-MM' del mes actual: el piso del input de mes (el mes en curso SI se acepta). */
function mesActualISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

/** 'YYYY-MM' del mes siguiente: el default del primer bloque ("el mes que viene gasto X"). */
function mesProximoISO() {
    var d = new Date();
    var m = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0');
}

/** 'sep 2026' para el resumen del bloque. Cosmetico y del cliente: la clave la valida el
 *  backend. Si el input type=month degrado a texto libre (Safari/Firefox) y lo tipeado no es
 *  una clave valida, se devuelve el texto CRUDO: mostrar 'Invalid Date' o un mes corrido por
 *  rollover de Date ('2026-13' -> ene 2027) prometia un mes que el guardado iba a negar. */
function mesCortoCliente(clave) {
    if (!clave) return '';
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(clave))) return String(clave);
    var p = String(clave).split('-');
    var f = new Date(Number(p[0]), Number(p[1]) - 1, 1);
    if (isNaN(f.getTime())) return String(clave);
    return f.toLocaleDateString('es-AR', { month: 'short', year: 'numeric' });
}

/** El signo del resumen lo decide el Plan: cuenta de ingresos suma, el resto resta. */
function esCuentaDeIngreso(cuenta) {
    return !!catalogo && (catalogo.ingresos || []).indexOf(cuenta) !== -1;
}

/**
 * Agrega un bloque heredando MES y MONEDA del anterior: es lo que se repite al cargar varias
 * proyecciones de una sentada. Monto, cuenta y nota cambian siempre y no se heredan.
 * Defaults del primer bloque: el mes que viene, y la moneda base -- aca no hay medio del cual
 * deducir la moneda, asi que arranca en la primera de MONEDAS_DISPONIBLES.
 */
function agregarBloqueProyeccion() {
    if (!catalogo) { avisoSinCatalogo(); return; }
    var lista = document.getElementById('proyLista');
    var previos = lista.querySelectorAll('.bloque');
    if (previos.length >= cupoMaximo()) return;

    var heredaMes = mesProximoISO();
    var heredaMoneda = (catalogo.monedas || [])[0];
    if (previos.length) {
        var ult = previos[previos.length - 1];
        heredaMes = ult.querySelector('.p-mes').value || heredaMes;
        heredaMoneda = ult.querySelector('.p-moneda').value || heredaMoneda;
        resumirProyeccion(ult);
        ult.dataset.estado = 'resumen';
    }

    var env = document.createElement('div');
    env.innerHTML = PLANTILLA_PROYECCION;
    var div = env.firstElementChild;
    lista.appendChild(div);

    vigilarCombo(div.querySelector('.p-cuenta'), todasLasCuentas());
    llenarSelect(div.querySelector('.p-moneda'), [{ items: catalogo.monedas }], heredaMoneda);
    div.querySelector('.p-pref').textContent = heredaMoneda;
    div.querySelector('.p-mes').value = heredaMes;
    div.querySelector('.p-mes').min = mesActualISO();
    div.querySelector('.p-moneda').onchange = function () {
        div.querySelector('.p-pref').textContent = div.querySelector('.p-moneda').value;
        actualizarTotalProyeccion();
    };
    div.querySelector('.p-monto').oninput = actualizarTotalProyeccion;
    div.querySelector('.p-cuenta').oninput = function () {
        var tipo = esCuentaDeIngreso(div.querySelector('.p-cuenta').value) ? 'Ingreso' : 'Egreso';
        div.dataset.tipo = tipo;
        div.querySelector('.bloque-punto').dataset.tipo = tipo;
        actualizarTotalProyeccion();
    };

    renumerarProyecciones();
    actualizarCupoProyeccion();
    actualizarTotalProyeccion();
    div.querySelector('.p-monto').focus();
}

function quitarBloqueProyeccion(btn) {
    var lista = document.getElementById('proyLista');
    if (lista.querySelectorAll('.bloque').length <= 1) return;
    btn.closest('.bloque').remove();
    renumerarProyecciones();
    actualizarCupoProyeccion();
    actualizarTotalProyeccion();
}

function abrirBloqueProyeccion(el) {

    var monto = aNumero(v('.p-monto'));

    b.querySelector('.bloque-punto').dataset.tipo = tipo;
    b.querySelector('.bloque-cuenta').textContent = v('.p-cuenta') || 'Sin cuenta';
    b.querySelector('.bloque-meta').textContent = mesCortoCliente(v('.p-mes'));

/** Sin tandas: la proyeccion no pasa por la grilla, se escribe directo en la base. */
function actualizarCupoProyeccion() {
    var n = document.querySelectorAll('#proyLista .bloque').length;
    document.getElementById('proyAgregar').disabled = n >= CUPO_BLOQUES;
    document.getElementById('proyCupo').textContent = n >= CUPO_BLOQUES
        ? 'Llegaste al tope de ' + CUPO_BLOQUES + ' por carga. Guarda estas y segui.'
        : n + ' proyeccion' + (n === 1 ? '' : 'es') + '. Se guardan todas juntas, directo en la base.';
}

/** El total del lote, solo si comparte moneda. Signo + para cuentas de ingresos, - para el resto. */
function actualizarTotalProyeccion() {
    var total = 0, monedas = {}, hay = false;
    document.querySelectorAll('#proyLista .bloque').forEach(function (b) {
        var m = aNumero(b.querySelector('.p-monto').value);
        if (m === '' || !m) return;
        hay = true;
        total += (esCuentaDeIngreso(b.querySelector('.p-cuenta').value) ? m : -m);
        monedas[b.querySelector('.p-moneda').value] = true;
    });
    var caja = document.getElementById('proyTotal');
    if (!hay) { caja.textContent = '\u2014'; caja.dataset.signo = ''; return; }
    var claves = Object.keys(monedas);
    if (claves.length > 1) { caja.textContent = 'varias monedas'; caja.dataset.signo = ''; return; }
    caja.dataset.signo = total < 0 ? 'neg' : 'pos';
    caja.textContent = (total < 0 ? '-' : '+') +
        Math.abs(total).toFixed(2).replace('.', ',') + ' ' + claves[0];
}

function guardarProyecciones() {
    var lista = [];

        lista.push({

}

function prepararRecurrentes() {
    llenarPeriodoVolcado();
    cargarRecurrentes();
}

/** Pide la lista al backend y la pinta. La hoja es la verdad, no el DOM. */
function cargarRecurrentes() {
    loader(true, 'Leyendo los recurrentes');
    var contesto = false;
    var tope = window.setTimeout(function () {
        if (contesto) return;
        contesto = true; loader(false);
        mostrarError('Los recurrentes estan tardando mas de la cuenta. Proba de nuevo.');
    }, 15000);
    var cerrar = function () { contesto = true; window.clearTimeout(tope); loader(false); };

    google.script.run
        .withSuccessHandler(function (r) {
            if (contesto) return;
            cerrar();
            if (!r || !r.ok) {
                mostrarError('No se pudieron leer los recurrentes: ' + ((r && r.error) || 'error desconocido'));
                return;
            }
            pintarRecurrentes(r.recurrentes || []);
        })
        .withFailureHandler(function (err) {
            if (contesto) return;
            cerrar();
            mostrarError('No se pudieron leer los recurrentes: ' + err.message);
        })
        .obtenerRecurrentes();
}

/** Un bloque por recurrente, TODOS en resumen: el usuario abre el que quiere tocar. */
function pintarRecurrentes(recs) {
    document.getElementById('recLista').innerHTML = '';
    recs.forEach(function (r) {
        var div = nuevoBloqueRecurrente(r);
        resumirRecurrente(div);
        div.dataset.estado = 'resumen';
    });
    renumerarRecurrentes();
    actualizarResumenRecurrentes();
}

/** Arma un bloque; con `r` lo puebla desde la hoja, sin `r` es un alta vacia. */
function nuevoBloqueRecurrente(r) {
    var env = document.createElement('div');
    env.innerHTML = PLANTILLA_RECURRENTE;
    var div = env.firstElementChild;
    document.getElementById('recLista').appendChild(div);

    vigilarCombo(div.querySelector('.r-cuenta'), todasLasCuentas());
    vigilarCombo(div.querySelector('.r-medio'), nombresDeMedio());
    llenarSelect(div.querySelector('.r-moneda'), [{ items: catalogo.monedas }]);
    div.querySelector('.r-medio').onchange = function () { monedaDelMedioRec(div); };
    div.querySelector('.r-moneda').onchange = function () {
        div.querySelector('.r-pref').textContent = div.querySelector('.r-moneda').value;
    };

    if (r) {
        div.dataset.guardado = '1';
        div.querySelector('.r-nombre').value = r.nombre;
        div.querySelector('.r-cuenta').value = r.cuenta;
        div.querySelector('.r-monto').value = String(r.monto).replace('.', ',');
        div.querySelector('.r-moneda').value = r.moneda;
        div.querySelector('.r-medio').value = r.medio;
        div.querySelector('.r-dia').value = r.dia;
        div.querySelector('.r-nota').value = r.nota || '';
        ponerActivo(div, r.activo ? 'Si' : 'No');
    } else {
        // La moneda la decide el medio, como en toda la casa (ADR-002).
        div.querySelector('.r-medio').value = medioPorDefecto();
        monedaDelMedioRec(div);
        ponerActivo(div, 'Si');
    }
    div.querySelector('.r-pref').textContent = div.querySelector('.r-moneda').value;
    return div;
}

/** La moneda del catalogo para el medio elegido, como monedaDelMedio pero sobre .r-*. */
function monedaDelMedioRec(div) {
    var medio = div.querySelector('.r-medio').value;
    var m = ((catalogo && catalogo.medios) || []).filter(function (x) { return x.nombre === medio; })[0];
    if (m && m.moneda) div.querySelector('.r-moneda').value = m.moneda;
    div.querySelector('.r-pref').textContent = div.querySelector('.r-moneda').value;
}

/** Segmentado Activo/Pausado -> input oculto con 'Si'/'No', que es lo que espera el backend. */
function ponerActivo(div, valor) {
    div.querySelector('.r-activo').value = valor;
    div.querySelectorAll('.seg button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.v === valor));
    });
    div.querySelector('.bloque-punto').dataset.activo = valor;
}

function segActivo(btn) {
    ponerActivo(btn.closest('.bloque'), btn.dataset.v);
    actualizarResumenRecurrentes();
}

function agregarBloqueRecurrente() {
    if (!catalogo) { avisoSinCatalogo(); return; }
    document.querySelectorAll('#recLista .bloque').forEach(function (o) {
        resumirRecurrente(o);
        o.dataset.estado = 'resumen';
    });
    var div = nuevoBloqueRecurrente(null);
    renumerarRecurrentes();
    actualizarResumenRecurrentes();
    div.querySelector('.r-nombre').focus();
}

function abrirBloqueRecurrente(el) {
    var b = el.closest('.bloque');
    document.querySelectorAll('#recLista .bloque').forEach(function (o) {
        if (o !== b) { resumirRecurrente(o); o.dataset.estado = 'resumen'; }
    });
    b.dataset.estado = 'edicion';
    b.querySelector('.r-monto').focus();
}

function resumirRecurrente(b) {
    var v = function (s) { var e = b.querySelector(s); return e ? e.value : ''; };
    var monto = aNumero(v('.r-monto'));
    b.querySelector('.bloque-punto').dataset.activo = v('.r-activo');
    b.querySelector('.bloque-cuenta').textContent = v('.r-nombre') || 'Sin nombre';
    // Punto medio como en toda la casa (resumirBloque): el guion chocaba con nombres de
    // cuenta que ya llevan guion y se leia como tres campos.
    b.querySelector('.bloque-meta').textContent =
        [v('.r-cuenta'), v('.r-dia') ? 'dia ' + v('.r-dia') : ''].filter(Boolean).join(' \u00b7 ');
    var caja = b.querySelector('.bloque-monto');
    caja.dataset.vacio = monto ? '0' : '1';
    caja.innerHTML = (monto ? escapar(monto.toFixed(2).replace('.', ','))
                            : '\u2014') + '<span class="u">' + escapar(v('.r-moneda')) + '</span>';
}

function renumerarRecurrentes() {
    document.querySelectorAll('#recLista .bloque').forEach(function (b, i) {
        b.querySelector('.bloque-num .n').textContent = (i + 1);
    });
}

function actualizarResumenRecurrentes() {
    var activos = 0, pausados = 0;
    document.querySelectorAll('#recLista .bloque .r-activo').forEach(function (x) {
        if (x.value === 'Si') activos++; else pausados++;
    });
    document.getElementById('recResumen').textContent =
        activos + ' activo' + (activos === 1 ? '' : 's') + ', ' +
        pausados + ' pausado' + (pausados === 1 ? '' : 's') + '.';
}

function guardarRecurrenteUI(btn) {
    var b = btn.closest('.bloque');
    var d = {
        nombre: b.querySelector('.r-nombre').value.trim(),
        cuenta: b.querySelector('.r-cuenta').value,
        monto: aNumero(b.querySelector('.r-monto').value),
        moneda: b.querySelector('.r-moneda').value,
        medio: b.querySelector('.r-medio').value,
        dia: parseInt(b.querySelector('.r-dia').value, 10),
        nota: b.querySelector('.r-nota').value,
        activo: b.querySelector('.r-activo').value
    };
    // Viaja tambien el boton apretado (elemento, no id: los botones por bloque no tienen id):
    // el overlay tapa el mouse pero no el teclado, y dos Enter rapidos eran dos upserts.
    enviar('guardarRecurrente', d, ['recBtnVolcar', btn], cargarRecurrentes);
}

/**
 * Borrado en DOS PASOS, sin dialogo nativo: el primer click arma la confirmacion sobre el
 * mismo boton y un timeout de 4 s la desarma; el segundo click borra de verdad. Un bloque
 * nuevo todavia no guardado se quita del DOM sin viaje al servidor.
 */
function borrarRecurrenteUI(btn) {
    var b = btn.closest('.bloque');
    if (b.dataset.guardado !== '1') {
        b.remove();
        renumerarRecurrentes();
        actualizarResumenRecurrentes();
        return;
    }
    if (btn.dataset.conf !== '1') {
        btn.dataset.conf = '1';
        btn.textContent = 'Confirmar borrado';
        window.setTimeout(function () {
            btn.dataset.conf = '0';
            btn.textContent = 'Borrar';
        }, 4000);
        return;
    }
    // El boton apretado viaja como elemento: un segundo Enter despues del primer borrado
    // llegaba tarde y devolvia 'No existe un recurrente llamado ...' como error falso.
    enviar('borrarRecurrente', b.querySelector('.r-nombre').value.trim(), ['recBtnVolcar', btn],
        cargarRecurrentes);
}

/** Los selects de periodo: meses en espanol (strings de UI) y el mes que viene por defecto. */
function llenarPeriodoVolcado() {
    var mesSel = document.getElementById('recMes');
    var anioSel = document.getElementById('recAnio');
    if (mesSel.options.length) return;
    var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto',
        'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    MESES.forEach(function (nombre, i) {
        var o = document.createElement('option');
        o.value = String(i + 1);
        o.textContent = nombre;
        mesSel.appendChild(o);
    });
    var hoy = new Date();
    var prox = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 1);
    for (var a = hoy.getFullYear(); a <= hoy.getFullYear() + 2; a++) {
        var oa = document.createElement('option');
        oa.value = String(a);
        oa.textContent = String(a);
        anioSel.appendChild(oa);
    }
    mesSel.value = String(prox.getMonth() + 1);
    anioSel.value = String(prox.getFullYear());
}

/** Pide el estado del volcado y arma la confirmacion inline con los numeros reales. */
function pedirVolcado() {
    var mes = Number(document.getElementById('recMes').value);
    var anio = Number(document.getElementById('recAnio').value);
    loader(true, 'Midiendo el volcado');
    var contesto = false;
    var tope = window.setTimeout(function () {
        if (contesto) return;
        contesto = true; loader(false);
        mostrarError('El estado del volcado esta tardando mas de la cuenta. Proba de nuevo.');
    }, 15000);
    var cerrar = function () { contesto = true; window.clearTimeout(tope); loader(false); };

    google.script.run
        .withSuccessHandler(function (r) {
            if (contesto) return;
            cerrar();
            if (!r || !r.ok) { mostrarError((r && r.error) || 'No se pudo medir el volcado.'); return; }
            if (!r.activos) { mostrarError('No hay recurrentes activos para volcar.'); return; }
            mostrarConfirmacionVolcado(r, mes, anio);
        })
        .withFailureHandler(function (err) {
            if (contesto) return;
            cerrar();
            mostrarError('No se pudo medir el volcado: ' + err.message);
        })
        .estadoVolcadoRecurrentes({ mes: mes, anio: anio });
}

function mostrarConfirmacionVolcado(r, mes, anio) {
    var tot = r.totalPorMoneda || {};
    var partes = Object.keys(tot).map(function (mon) {
        return Number(tot[mon]).toFixed(2).replace('.', ',') + ' ' + mon;
    });
    var t = 'Se van a volcar ' + r.activos + ' recurrente' + (r.activos === 1 ? '' : 's') +
        ' a ' + r.periodo + (partes.length ? ' por ' + partes.join(' | ') : '') + '.';
    if (r.previasPropias) {
        t += ' Reemplaza el volcado anterior de ese mes (' + r.previasPropias + ' filas).';
    }
    var otras = r.otrasDelMes || {};
    if (otras.base || otras.manual) {
        t += ' El mes ya tiene ' + (otras.base || 0) + ' fila(s) del presupuesto base y ' +
            (otras.manual || 0) + ' del guardado manual: no se tocan, y se SUMAN a lo volcado.';
    }

    var caja = document.getElementById('shellAviso');
    caja.innerHTML = '';
    var alerta = document.createElement('div');
    alerta.className = 'alert alert-warning';
    var texto = document.createElement('span');
    texto.textContent = t;
    var confirmar = document.createElement('button');
    confirmar.className = 'btn btn-primary';
    confirmar.textContent = 'Confirmar volcado';
    confirmar.onclick = function () {
        enviar('volcarRecurrentesAlMes', { mes: mes, anio: anio }, ['recBtnVolcar'], function () {
            cargarRecurrentes();   // queda en la vista: el volcado no es un cierre
        });
    };
    var cancelar = document.createElement('button');
    cancelar.className = 'btn btn-secondary';
    cancelar.textContent = 'Cancelar';
    cancelar.onclick = limpiarAviso;
    alerta.appendChild(texto);
    alerta.appendChild(confirmar);
    alerta.appendChild(cancelar);
    caja.appendChild(alerta);
}

// ============================================
// CONCILIACION -- saldo sistema vs saldo real, ajuste por diferencia
// ============================================
//
// La tabla muestra TODOS los medios del Plan con el saldo que calcula el sistema (ultimo
// Inicio Mes + lo posterior). Una caja sin declarar conserva su saldo: nunca se asume cero.
// Solo las diferencias fuera de tolerancia se cargan, como movimientos de la cuenta Ajuste,
// por el pipeline de siempre. La tolerancia viaja del backend: no se retipea aca.

function prepararConciliacion() {
    saldosConc = null;
    medirSaldosConciliacion();
}

function medirSaldosConciliacion() {
    document.getElementById('concContenido').innerHTML = '';
    document.getElementById('concResumen').textContent = '';
    document.getElementById('concBtnGuardar').disabled = true;
    loader(true, 'Midiendo los saldos');
    var contesto = false;
    var tope = window.setTimeout(function () {
        if (contesto) return;
        contesto = true; loader(false);
        errorConciliacion('La medicion de saldos esta tardando mas de la cuenta.');
    }, 30000);
    var cerrar = function () { contesto = true; window.clearTimeout(tope); loader(false); };

    google.script.run
        .withSuccessHandler(function (r) {
            if (contesto) return;
            cerrar();
            if (!r || !r.ok) {
                errorConciliacion((r && r.error) || 'No se pudieron medir los saldos.');
                return;
            }
            saldosConc = r;
            pintarConciliacion(r);
        })
        .withFailureHandler(function (err) {
            if (contesto) return;
            cerrar();
            errorConciliacion('No se pudieron medir los saldos: ' + err.message);
        })
        .obtenerSaldosConciliacion();
}

/** El estado de error vive EN la vista, con Reintentar: un aviso suelto se pierde al navegar. */
function errorConciliacion(txt) {
    var cont = document.getElementById('concContenido');
    cont.innerHTML = '';
    var alerta = document.createElement('div');
    alerta.className = 'alert alert-error';
    var s = document.createElement('span');
    s.textContent = txt;
    var b = document.createElement('button');
    b.className = 'btn btn-secondary';
    b.textContent = 'Reintentar';
    b.onclick = medirSaldosConciliacion;
    alerta.appendChild(s);
    alerta.appendChild(b);
    cont.appendChild(alerta);
}

/** 'dd/MM/yyyy' -> timestamp, para comparar las fechas que manda el backend. */
function fechaDeTexto(s) {
    var p = String(s || '').split('/');
    if (p.length !== 3) return NaN;
    return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0])).getTime();
}

function pintarConciliacion(r) {
    var cont = document.getElementById('concContenido');
    cont.innerHTML = '';

    var hint = document.createElement('div');
    hint.className = 'conc-hint';
    hint.textContent = 'Los ajustes se cargan con fecha de hoy, con la cuenta Ajuste.';
    cont.appendChild(hint);

    // La advertencia del ledger corto, portada del DEVTOOL: un movimiento real sin cargar de
    // esos dias queda adentro del ajuste, sin detalle.
    var tLedger = fechaDeTexto(r.ultimaFechaLedger);
    var tHoy = fechaDeTexto(r.hoy);
    if (isFinite(tLedger) && isFinite(tHoy) && tLedger < tHoy) {
        var alerta = document.createElement('div');
        alerta.className = 'conc-hint alerta';
        alerta.textContent = 'El ledger llega hasta el ' + r.ultimaFechaLedger + '. Si te ' +
            'falta cargar movimientos de esos dias, cargalos ANTES de conciliar: si no, ' +
            'quedan adentro del ajuste, sin detalle.';
        cont.appendChild(alerta);
    }

    var card = document.createElement('div');
    card.className = 'conc-card';
    var tabla = document.createElement('table');
    tabla.className = 'conc-tabla';
    tabla.id = 'concTabla';
    var thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Caja</th><th class="num">Segun la planilla</th>' +
        '<th class="num">Lo que hay de verdad</th><th>Estado</th></tr>';
    tabla.appendChild(thead);
    var tbody = document.createElement('tbody');
    (r.saldos || []).forEach(function (s) {
        var tr = document.createElement('tr');
        tr.dataset.medio = s.medio;
        tr.dataset.moneda = s.moneda;
        tr.dataset.saldo = String(s.saldo);
        var tdMedio = document.createElement('td');
        tdMedio.innerHTML = '<span class="conc-medio">' + escapar(s.medio) + '</span>' +
            '<span class="conc-tag">' + escapar(s.moneda) + '</span>';
        var tdSis = document.createElement('td');
        tdSis.className = 'num conc-sis';
        tdSis.textContent = Number(s.saldo).toFixed(2).replace('.', ',');
        var tdReal = document.createElement('td');
        tdReal.className = 'num';
        var input = document.createElement('input');
        input.className = 'conc-real';
        input.setAttribute('inputmode', 'decimal');
        input.placeholder = '\u2014';
        input.oninput = function () {
            estadoFilaConciliacion(tr);
            actualizarResumenConciliacion();
        };
        tdReal.appendChild(input);
        var tdEstado = document.createElement('td');
        tdEstado.className = 'conc-estado';
        tdEstado.innerHTML = '<span class="conc-dir">\u2014</span>';
        tr.appendChild(tdMedio);
        tr.appendChild(tdSis);
        tr.appendChild(tdReal);
        tr.appendChild(tdEstado);
        tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);
    card.appendChild(tabla);
    cont.appendChild(card);
    actualizarResumenConciliacion();
}

function toleranciaConc() {
    return (saldosConc && typeof saldosConc.tolerancia === 'number') ? saldosConc.tolerancia : 0;
}

/** null = sin declarar (no se toca la caja); NaN = tipeo invalido; numero = diferencia. */
function deltaDeFila(tr) {
    var v = tr.querySelector('.conc-real').value.trim();
    if (v === '') return null;
    var real = aNumero(v);
    if (real === '') return NaN;
    return Math.round((real - Number(tr.dataset.saldo)) * 100) / 100;
}

function estadoFilaConciliacion(tr) {
    var celda = tr.querySelector('.conc-estado');
    var delta = deltaDeFila(tr);
    if (delta === null) { celda.innerHTML = '<span class="conc-dir">\u2014</span>'; return; }
    if (isNaN(delta)) { celda.innerHTML = '<span class="conc-dir">no es un numero</span>'; return; }
    if (Math.abs(delta) <= toleranciaConc()) {
        celda.innerHTML = '<span class="conc-pill" data-dir="igual">Coincide</span>';
        return;
    }
    celda.innerHTML = '<span class="conc-pill" data-dir="' + (delta > 0 ? 'mas' : 'menos') + '">' +
        (delta > 0 ? '+' : '-') + Math.abs(delta).toFixed(2).replace('.', ',') + '</span>' +
        '<span class="conc-sub">entra como ' + (delta > 0 ? 'Ingreso' : 'Egreso') + '</span>';
}

/** El resumen del lote, POR MONEDA y nunca cruzado: sumar monedas distintas seria mentir. */
function actualizarResumenConciliacion() {
    var n = 0, porMoneda = {};
    document.querySelectorAll('#concTabla tbody tr').forEach(function (tr) {
        var delta = deltaDeFila(tr);
        if (delta === null || isNaN(delta) || Math.abs(delta) <= toleranciaConc()) return;
        n++;
        porMoneda[tr.dataset.moneda] = (porMoneda[tr.dataset.moneda] || 0) + delta;
    });
    var caja = document.getElementById('concResumen');
    if (!n) {
        caja.textContent = '';
    } else {
        var partes = Object.keys(porMoneda).map(function (mon) {
            var t = porMoneda[mon];
            return (t < 0 ? '-' : '+') + Math.abs(t).toFixed(2).replace('.', ',') + ' ' + mon;
        });
        caja.textContent = n + ' ajuste' + (n === 1 ? '' : 's') + ': ' + partes.join(' | ');
    }
    document.getElementById('concBtnGuardar').disabled = n === 0;
}

function guardarConciliacion() {
    var lista = [];
    document.querySelectorAll('#concTabla tbody tr').forEach(function (tr) {
        var delta = deltaDeFila(tr);
        if (delta === null || isNaN(delta) || Math.abs(delta) <= toleranciaConc()) return;
        lista.push({
            medio: tr.dataset.medio,
            saldoVisto: Number(tr.dataset.saldo),
            saldoReal: aNumero(tr.querySelector('.conc-real').value)
        });
    });
    enviar('registrarConciliacion', lista, ['concBtnGuardar'], function () {
        saldosConc = null;
        irAVista('home');
    });
}

/**
 * Manda al backend y maneja los cuatro finales posibles: exito, validacion rechazada, error
 * del servidor y silencio. Los botones se deshabilitan mientras viaja: dos clicks son dos
 * movimientos, y en un ledger eso es un duplicado que despues hay que ir a buscar a mano.
 */
function enviar(fn, datos, botones, alSalirBien) {
    // `botones` acepta ids Y elementos: los botones por bloque de recurrentes no tienen id,
    // y sin deshabilitar el boton apretado, dos Enter con el foco puesto eran dos viajes.
    var deshabilitar = function (v) {
        botones.forEach(function (bt) {
            var b = typeof bt === 'string' ? document.getElementById(bt) : bt;
            if (b) b.disabled = v;
        });
    };
    deshabilitar(true); loader(true, 'Guardando'); limpiarAviso();

    var contesto = false;
    var tope = window.setTimeout(function () {
        if (contesto) return;
        contesto = true; loader(false); deshabilitar(false);
        mostrarError('La planilla esta tardando y no se pudo confirmar si entro. Miralo en la ' +
            'hoja Registros antes de cargarlo de nuevo.');
    }, 60000);
    var cerrar = function () { contesto = true; window.clearTimeout(tope); loader(false); deshabilitar(false); };

    google.script.run
        .withSuccessHandler(function (r) {
            if (contesto) return;
            cerrar();
            // alSalirBien PRIMERO: los callbacks navegan con irAVista, que limpia el aviso
            // en el mismo tick -- con el orden invertido, el mensaje de exito del backend
            // (con semantica real: totales, advertencias) se borraba sin un solo frame.
            if (r && r.ok) { alSalirBien(); mostrarOk(r.mensaje || 'Listo.'); }
            else if (r && r.problemas) { mostrarError(r.problemas.join(' ')); }
            else { mostrarError((r && r.error) || 'No se pudo guardar.'); }
        })
        .withFailureHandler(function (err) {
            if (contesto) return;
            cerrar();
            mostrarError('No se pudo guardar: ' + err.message);
        })[fn](datos);
}

document.addEventListener('DOMContentLoaded', function () {
    // El punto de estado de cada tarjeta sale de SHELL_VISTAS, que lo declara el backend: no se
    // retipea aca cual esta lista y cual no.
    document.querySelectorAll('#vista-home .shell-card[data-vista]').forEach(function (c) {
        var v = VISTAS.filter(function (x) { return x.id === c.dataset.vista; })[0];
        c.dataset.listo = (v && v.listo) ? '1' : '0';
    });
    // Cero llamadas al servidor: el shell se ve completo apenas abre.
    irAVista(VISTA_INICIAL);
});
</script>
