<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Shell Tidetrack - simulacion del modal de Sheets</title>
<style>
/* ============================================================
   MARCO DE SIMULACION -- pone el shell dentro de un dialogo del tamano real.

   [CONCEPTO DE NEGOCIO]
   El shell vive en un modal de Google Sheets de tamano FIJO. Servido a
   pantalla completa, la banda y el pie se estiran al ancho de la ventana y
   desaparece el scroll que el usuario real si tiene: se juzga una pantalla que
   no existe. Este marco lo devuelve a sus proporciones.

   [FUNDAMENTO TEORICO / ADMINISTRATIVO]
   El shell va en un IFRAME, no en un div. Un iframe es un viewport de verdad:
   adentro, 100% de alto son 700px, las media queries evaluan contra 900px y
   position:fixed se ancla ahi. .shell-overlay es "position: fixed; inset: 0"
   (src/UI_Shell.html): en un div taparia la ventana entera.
   Si la ventana no da, se escala el DIALOGO con transform, jamas el area del
   shell: achicarla cruzaria el breakpoint de 700px de UI_Shell.html y
   mostraria otro layout, que es exactamente lo que se quiere evitar.

   ESTE ARCHIVO ES FUENTE, NO GENERADO: se edita a mano. El generado es
   index.html, que sale de aca con los huecos resueltos.

   @see src/16_ShellService.js (SHELL_GEOMETRIA)
   ============================================================ */

/* ---- MEDIDO. INYECTADO POR EL GENERADOR DESDE SHELL_GEOMETRIA. NO EDITAR ----
   Los huecos los resuelve devtools/regenerar_servidor_shell.py leyendo
   SHELL_GEOMETRIA de src/16_ShellService.js. Si se escriben a mano, el
   generador aborta: una segunda copia de un numero siempre termina mintiendo. */
:root {
    --sim-ancho: 900px;
    --sim-alto:  700px;
}

/* ---- SUPUESTOS. TODOS JUNTOS, A PROPOSITO ----------------------------------
   Ninguno de estos numeros esta medido del cromo real de Google: son una
   aproximacion razonable del dialogo de Sheets. Corregir la simulacion contra
   una captura real es editar SOLO este bloque, y nada mas.
   La unica excepcion es --sim-x-derecha, que sale de un comentario del repo
   (src/UI_Shell.html: la "x" propia del dialogo "esta a ~16px"), y que el
   propio comentario declara aproximada. */
:root {
    --sim-barra-alto:      46px;
    --sim-barra-fondo:     #ffffff;
    --sim-barra-linea:     #e8eaed;
    --sim-x-derecha:       16px;
    --sim-x-tam:           24px;
    --sim-x-color:         #5f6368;
    --sim-x-hover:         #f1f3f4;
    --sim-radio:           8px;
    --sim-sombra:          0 24px 48px rgba(32,33,36,0.28),
                           0 2px 6px rgba(32,33,36,0.16);
    --sim-margen:          24px;
    --sim-velo:            rgba(32,33,36,0.55);
    --sim-hoja-papel:      #ffffff;
    --sim-hoja-linea:      #e2e5e9;
    --sim-hoja-col:        100px;
    --sim-hoja-fila:       21px;
    --sim-hoja-encabezado: #f8f9fa;
    --sim-hoja-barra:      108px;
    --sim-etiqueta-tinta:  rgba(255,255,255,0.72);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    overflow: hidden;   /* el dialogo se escala, no se scrollea */
    background: #202124;
    font: 500 11px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* ---- LA HOJA POR DETRAS. Evocativa, no una replica: dos grillas repetidas y
   una banda superior. Cero imagenes, cero pixel-hunting. */
.sim-hoja {
    position: fixed; inset: 0; z-index: 0;
    background:
        repeating-linear-gradient(to right,
            var(--sim-hoja-linea) 0 1px, transparent 1px var(--sim-hoja-col)),
        repeating-linear-gradient(to bottom,
            var(--sim-hoja-linea) 0 1px, transparent 1px var(--sim-hoja-fila)),
        var(--sim-hoja-papel);
}
.sim-hoja::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0;
    height: var(--sim-hoja-barra);
    background: var(--sim-hoja-encabezado);
    box-shadow: inset 0 -1px 0 var(--sim-hoja-linea);
}
.sim-velo { position: fixed; inset: 0; z-index: 1; background: var(--sim-velo); }

/* ---- CENTRADO. El flex centra; el scale se aplica adentro y no lo desarma. */
.sim-centro {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
}

/* ---- EL DIALOGO. Ancho = el area de contenido. Alto = area + barra de
   titulo, porque en Sheets la barra va POR FUERA del setHeight. */
.sim-dialogo {
    /* decision Franco 2026-08-29: flex:0 0 auto es obligatorio, no cosmetico.
       .sim-dialogo es un flex item de .sim-centro y flex-shrink vale 1 por
       defecto: en una ventana angosta el item se ENCOGIA por debajo de
       --sim-ancho y el overflow:hidden de abajo RECORTABA el iframe por la
       derecha (medido: ventana 573px -> dialogo 313px sobre un iframe de
       492px). El unico mecanismo de adaptacion permitido es el scale del JS,
       que no reflowea el contenido; encogerse cruzaria el breakpoint de
       UI_Shell.html y mostraria otro layout, que es lo que el marco evita. */
    flex: 0 0 auto;
    width: var(--sim-ancho);
    height: calc(var(--sim-alto) + var(--sim-barra-alto));
    display: flex; flex-direction: column;
    background: var(--sim-barra-fondo);
    border-radius: var(--sim-radio);
    box-shadow: var(--sim-sombra);
    overflow: hidden;                  /* recorta el iframe contra el radio */
    transform-origin: center center;   /* el scale lo pone el JS */
}

/* ---- BARRA DE TITULO. VACIA A PROPOSITO: el titulo real se rellena con
   espacios (src/16_ShellService.js) y hay un test que lo defiende
   (devtools/probar_shell.js). La barra igual existe, y la x tambien. */
.sim-barra {
    flex: 0 0 auto; position: relative;
    height: var(--sim-barra-alto);
    background: var(--sim-barra-fondo);
    box-shadow: inset 0 -1px 0 var(--sim-barra-linea);
}
.sim-x {
    position: absolute; top: 50%; right: var(--sim-x-derecha);
    transform: translateY(-50%);
    width: var(--sim-x-tam); height: var(--sim-x-tam);
    display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--sim-x-color); cursor: pointer;
}
.sim-x:hover { background: var(--sim-x-hover); }
.sim-x svg { width: 15px; height: 15px; }

/* ---- EL SHELL. 900x700 EXACTOS, SIEMPRE. Si esto se vuelve un porcentaje,
   se pierde todo el sentido del marco. */
.sim-lienzo {
    flex: 0 0 auto; display: block;
    width: var(--sim-ancho); height: var(--sim-alto);
    border: 0;
    /* decision Franco 2026-08-29: el lienzo pasa de #eff2f9 (gris del design
       system navy, muerto desde Corriente) a #FFFFFF, que es el fondo real del
       body del shell (src/UI_Shell.html, ultima capa del background). Mientras
       el iframe carga, el marco debe mostrar el mismo color que va a aparecer:
       con el gris viejo el arranque parpadeaba a un color que ya no existe. */
    background: #FFFFFF;
}

/* ---- CERRADO. La x oculta el dialogo; el boton lo reabre RECARGANDO el
   iframe, que es el camino de apertura de verdad. */
.sim-reabrir {
    display: none;
    align-items: center; gap: 8px;
    height: 34px; padding: 0 16px;
    border: 0; border-radius: 999px;
    background: #34475d; color: #fff;   /* el navy medido de la planilla */
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 4px 12px rgba(32,33,36,0.35);
}
body.sim-cerrado .sim-dialogo { display: none; }
body.sim-cerrado .sim-velo    { display: none; }
body.sim-cerrado .sim-reabrir { display: inline-flex; }

/* ---- ETIQUETA. Que el porcentaje este a la vista evita el malentendido de
   creer que lo que se ve al 87% es el tamano fisico real. */
.sim-etiqueta {
    position: fixed; z-index: 3; right: 10px; bottom: 8px;
    color: var(--sim-etiqueta-tinta); letter-spacing: 0.04em;
    pointer-events: none;
}
body.sim-cerrado .sim-etiqueta { display: none; }
</style>
</head>
<body>

<div class="sim-hoja" aria-hidden="true"></div>
<div class="sim-velo" aria-hidden="true"></div>

<div class="sim-centro">
    <div class="sim-dialogo" id="simDialogo">
        <div class="sim-barra">
            <button class="sim-x" id="simCerrar" title="Cerrar" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>
        <iframe class="sim-lienzo" id="simShell" title="Shell Tidetrack"
                src="shell.html" data-src="shell.html"></iframe>
    </div>

    <button class="sim-reabrir" id="simAbrir">Tidetrack - abrir</button>
</div>

<div class="sim-etiqueta">
    modal simulado 900 x 700 px reales - vista al <span id="simEscala">100%</span>
</div>

<script>
(function () {
    var raiz = getComputedStyle(document.documentElement);
    var num = function (nombre) { return parseFloat(raiz.getPropertyValue(nombre)) || 0; };

    var ANCHO  = num('--sim-ancho');
    var ALTO   = num('--sim-alto') + num('--sim-barra-alto');
    var MARGEN = num('--sim-margen');

    var dialogo = document.getElementById('simDialogo');
    var shell   = document.getElementById('simShell');
    var pct     = document.getElementById('simEscala');

    // decision Franco 2026-08-25: se escala con transform y NUNCA por encima de 1.
    // transform no reflowea el contenido del iframe -- adentro sigue midiendo
    // 900x700 en px CSS -- que es la unica razon por la que esto no destruye lo
    // que se quiere mirar. Agrandar, ademas, mentiria sobre el tamano fisico.
    function ajustar() {
        var k = Math.min(1,
            (window.innerWidth  - 2 * MARGEN) / ANCHO,
            (window.innerHeight - 2 * MARGEN) / ALTO);
        if (!(k > 0)) { k = 1; }
        dialogo.style.transform = 'scale(' + k + ')';
        pct.textContent = Math.round(k * 100) + '%';
    }

    document.getElementById('simCerrar').addEventListener('click', function () {
        document.body.classList.add('sim-cerrado');
    });

    // Reabrir REASIGNA el src: es una recarga de verdad, o sea el camino de
    // apertura desde cero. Es la unica forma de volver a ver las animaciones
    // escalonadas de las tarjetas del Home.
    document.getElementById('simAbrir').addEventListener('click', function () {
        document.body.classList.remove('sim-cerrado');
        shell.src = shell.getAttribute('data-src');
    });

    window.addEventListener('resize', ajustar);
    ajustar();
})();
</script>
</body>
</html>
