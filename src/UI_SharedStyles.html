<style>
/* ============================================
 * DESIGN SYSTEM CONSTANTS - TIDETRACK (GLOBAL)
 * ============================================
 */

:root {
 /* Color Palette */
 --primary-color: #34475d; /* Darkest, relevant blocks */
 --primary-dark: #2b3a4d; /* Slightly darker shade */
 --secondary-color: #6e7f8d;
 --secondary-hover: #5d6c78;
 --accent-color: #b5bfc6; /* Button para "botones seleccionados" */
 --accent-hover: #9eabb5;
 
 /* Backgrounds */
 --bg-main: #eff2f9; /* Fondo de hojas / paneles */
 --bg-secondary: #FFFFFF;
 --bg-tertiary: #e2e8f0;

 /* Texts */
 --text-main: #34475d;
 /* El color del CUERPO DE DATOS de la hoja: 4.136 celdas, el mas usado por lejos, y NO es
  * negro puro (el default de Sheets es #000000, asi que si esta serializado es porque Franco
  * lo puso a mano). Los numeros y el texto de tabla del shell van con este, no con --text-main,
  * que es la tinta de la CHROME (titulos de bloque y headers). */
 --text-data: #39444d;
 /* decision Franco 2026-08-25: #6e7f8d daba 3.69:1 sobre el fondo de bloque #eff2f9 y
  * 4.14:1 sobre blanco -- por debajo del minimo AA de 4.5:1 para texto normal. Se veia
  * lavado, y "lavado" en un modal chico se lee como "sin terminar". #5f6368 -- el que usa
  * pymes -- da 6.4:1 sobre blanco. */
 --text-secondary: #5f6368;
 --text-accent: #6e7f8d;
 --text-inverse: #FFFFFF;

 /* Semantic Colors
  * decision Franco 2026-08-24: los tres colores de estado pasan a ser los MEDIDOS de la
  * planilla, no los de Tailwind. Antes eran #10B981 / #EF4444 / #F59E0B, que no aparecen en
  * ninguna celda de la hoja: un popup con esos verdes y rojos se lee como otro producto.
  * Los de abajo son los que el codigo declaro canonicos el 2026-08-21 y los que viven
  * LITERALES dentro de las formulas SPARKLINE de Inicio!F19:F22, con su riel al lado.
  * @see DEVTOOL_InicioPresupuesto.js (IP_COLOR_VERDE / NARANJA / ROJO y sus fondos)
  */
 --success: #356854;
 --success-bg: #e6f4ea;
 --danger: #c93232;
 --danger-bg: #fce8e6;
 --warning: #ffb300;
 --warning-bg: #fef7e0;
 --info: #3B82F6;
 --info-bg: #DBEAFE;

 /* Visual Styles */
 --border-color: #E2E8F0; /* Slate 200 */
 --border-radius-sm: 6px;
 --border-radius-md: 8px;
 --border-radius-lg: 12px;
 --border-radius-xl: 16px;
 
 /* Shadows */
 --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
 --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
 --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

 /* Fonts */
 --font-family: 'Google Sans', 'Roboto', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
 /* decision Franco 2026-08-25: se RETIRA --font-mono. Declaraba JetBrains Mono y Fira Code,
  * ninguna de las dos instalada en macOS/Chrome, asi que en la practica resolvia a Courier
  * New -- cuya altura de x es ~0.42em contra ~0.53em de una grotesca. Usado en un rotulo de
  * 11px, las minusculas median ~4,4px al lado de un control de 14px sans, y eso se lee como
  * texto roto, no como jerarquia. Fue la causa de las "distorciones de tamanos de letras".
  * Un token que resuelve a algo que nadie eligio es una trampa para el que venga: se saca.
  * Si algun dia hace falta mono de verdad, se carga la webfont primero. */

 /* Transitions */
 --transition-fast: 0.15s ease-in-out;
 --transition-normal: 0.25s ease-in-out;
}

/* ============================================
 * RESET & BASE COMPONENT STYLES
 * ============================================
 */

* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: var(--font-family);
}

body {
 background-color: var(--bg-main);
 color: var(--text-main);
 font-size: 14px;
 line-height: 1.5;
 padding: 16px;
 -webkit-font-smoothing: antialiased;
}

/* Layout */
.container {
 max-width: 1200px;
 margin: 0 auto;
 width: 100%;
}

.container-xs { max-width: 480px; }
.container-sm { max-width: 640px; }
.container-md { max-width: 768px; }

/* Utilities */
.hidden { display: none !important; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.text-muted { color: var(--text-secondary); }

/* Dividers */
hr.divider {
 border: 0;
 border-top: 1px solid var(--border-color);
 margin: 24px 0;
}

/* ============================================
 * FORMS & INPUTS
 * ============================================
 */

.form-group {
 margin-bottom: 20px;
}

.form-label {
 display: block;
 font-weight: 500;
 margin-bottom: 8px;
 color: var(--primary-color);
 font-size: 13px;
 letter-spacing: 0.3px;
}

.form-input, .form-select {
 width: 100%;
 padding: 12px 14px;
 border: 1px solid var(--border-color);
 border-radius: var(--border-radius-md);
 font-size: 14px;
 color: var(--text-main);
 background-color: var(--bg-secondary);
 transition: all var(--transition-fast);
 box-shadow: var(--shadow-sm);
}

/* decision Franco 2026-08-25: el foco era un halo GRIS sobre fondo gris, o sea invisible.
 * Ahora es el mismo tratamiento que el de los botones -- un solo foco para todo el sistema,
 * como hace pymes. */
.form-input:focus, .form-select:focus {
 outline: 2px solid var(--primary-color);
 outline-offset: 1px;
 border-color: var(--primary-color);
 box-shadow: none;
}

.form-input::placeholder {
 color: #94A3B8;
}

/* ============================================
 * BUTTONS
 * ============================================
 */

.btn {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 padding: 10px 18px;
 font-weight: 500;
 border-radius: var(--border-radius-md);
 cursor: pointer;
 border: none;
 font-size: 14px;
 transition: all var(--transition-fast);
 gap: 8px;
}

.btn:active {
 transform: translateY(1px);
}

.btn-primary {
 background-color: var(--primary-color);
 color: var(--text-inverse);
 box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
 background-color: var(--primary-dark);
 box-shadow: var(--shadow-md);
}

.btn-secondary {
 background-color: var(--bg-secondary);
 color: var(--text-main);
 border: 1px solid var(--border-color);
}

.btn-secondary:hover {
 background-color: var(--bg-tertiary);
 border-color: #CBD5E1;
}

.btn-danger {
 background-color: var(--danger);
 color: var(--text-inverse);
}

.btn-danger:hover {
 background-color: #DC2626; /* Red 600 */
}

.btn-selected {
 background-color: var(--accent-color);
 color: var(--primary-color);
 border: 1px solid var(--accent-color);
 font-weight: 500;
}

.btn-selected:hover {
 background-color: var(--accent-hover);
 color: var(--primary-color);
}

.btn:disabled {
 opacity: 0.6;
 cursor: not-allowed;
 transform: none;
}

.form-actions {
 display: flex;
 justify-content: flex-end;
 gap: 12px;
}

/* ============================================
 * CARDS & PANELS
 * ============================================
 */

.card {
 background-color: var(--bg-secondary);
 border-radius: var(--border-radius-lg);
 border: 1px solid var(--border-color);
 box-shadow: var(--shadow-sm);
 padding: 24px;
 margin-bottom: 24px;
}

/* ============================================
 * ALERTAS
 * ============================================
 * decision Franco 2026-08-24: fondo tenido y tinta, SIN franja de acento lateral.
 * La planilla no usa bordes en ningun lado -- no hay un solo setBorder en todo src/ y los
 * bloques se separan con una columna vacia, no con lineas -- asi que una barra de color de
 * 3px al costado se lee como de otro producto. El color del fondo ya dice todo lo que la
 * franja diria. Los pares fondo/tinta son los del semaforo medido de la hoja.
 */

.alert {
 padding: 12px 15px;
 border-radius: var(--border-radius-sm);
 font-size: 13px;
 margin-bottom: 16px;
}

.alert-error { background-color: var(--danger-bg); color: var(--danger); }
.alert-ok { background-color: var(--success-bg); color: var(--success); }
.alert-warning { background-color: var(--warning-bg); color: #6d4d00; }
.alert-info { background-color: var(--bg-main); color: var(--text-main); }

/* ============================================
 * CUSTOM SCROLLBAR
 * ============================================
 */

::-webkit-scrollbar {
 width: 8px;
 height: 8px;
}

::-webkit-scrollbar-track {
 background: var(--bg-main);
}

::-webkit-scrollbar-thumb {
 background: #CBD5E1;
 border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
 background: #94A3B8;
}

</style>
