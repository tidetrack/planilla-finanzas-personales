<style>
/* ============================================
 * RESET Y FORMA COMPARTIDA - TIDETRACK
 * ============================================
 *
 * [CONCEPTO DE NEGOCIO]
 * Fragmento que TODA pantalla HtmlService incluye antes de su propio <style>. Hoy su unico
 * consumidor es src/UI_Shell.html (el Centro de Operaciones); los dos modales que lo compartian
 * -- UI_AbmPlanCuentas.html y UI_AbmProyeccionElaborada.html -- fueron absorbidos por el shell y
 * se borraron el 2026-08-30.
 *
 * [FUNDAMENTO TEORICO / ADMINISTRATIVO]
 * decision Franco 2026-08-30: ACA NO VIVE NINGUN COLOR. Este archivo declaraba una paleta entera
 * de otra generacion (#34475d, #eff2f9, #e2e8f0, #5f6368, #c93232, #ffb300, #3B82F6, #CBD5E1,
 * #94A3B8, #DC2626) y --font-family: 'Google Sans', y parte de esa paleta RENDERIZABA de verdad
 * dentro del shell: las scrollbars globales pintaban el pulgar #CBD5E1 sobre el track #eff2f9 en
 * todo elemento con scroll salvo .shell-scroll, que era el unico que el shell redefinia -- por
 * eso la tabla de Conciliacion mostraba la barra gris de la generacion anterior. El guard de
 * paleta del banco no miraba este archivo, asi que el recolor al brandbook Ed.03 podia declararse
 * completo estando a medias.
 *
 * La salida no fue repintar cada token, sino sacar la decision de color de aca: el shell ya tiene
 * su :root con la lista blanca del brandbook y redefine por su cuenta cada componente que usa
 * (.btn, .btn-primary, .btn-secondary, .alert, .form-input, .hidden, body). Todo lo que quedaba
 * en este archivo o estaba pisado por el shell o solo servia a los dos modales borrados. Lo que
 * sobrevive es lo que de verdad se comparte: el reset, la familia tipografica como UN solo punto
 * de cambio, y las scrollbars -- que ahora usan el mismo tratamiento del shell y por eso pintan
 * igual en .shell-scroll y en cualquier otro contenedor con overflow.
 *
 * REGLA VIGENTE: si aca vuelve a aparecer un color, el guard de paleta (devtools/probar_shell.js,
 * seccion 23) lo rechaza contra la lista blanca del brandbook, igual que al <style> del shell.
 *
 * @see src/UI_Shell.html (el unico consumidor: sus tokens de :root son la paleta real)
 * @see devtools/probar_shell.js seccion 23 (el guard que audita este archivo)
 */

:root {
 /* TIPOGRAFIA. Brandbook Ed.03: DM Sans, familia unica. El `*` de abajo la propaga a todo el
  * documento, asi que redefinir este token es el unico gesto necesario para cambiarla entera.
  * El shell la redeclara con la misma familia y sus fallbacks; se deja aca el default para que
  * una pantalla futura que solo incluya este fragmento no caiga en la fuente del sistema.
  * decision Franco 2026-08-25: NO hay --font-mono. Declaraba JetBrains Mono y Fira Code, ninguna
  * instalada, asi que resolvia a Courier New -- cuya altura de x es ~0.42em contra ~0.53em de una
  * grotesca. En un rotulo de 11px las minusculas median ~4,4px al lado de un control de 14px
  * sans, y eso se lee como texto roto, no como jerarquia: fue la causa de las "distorciones de
  * tamanos de letras". Un token que resuelve a algo que nadie eligio es una trampa: se saca. */
 --font-family: 'DM Sans', 'Segoe UI', sans-serif;

 /* GEOMETRIA Y MOVIMIENTO. Sin color: son medidas, y el shell las reusa o las redefine. */
 --border-radius-sm: 6px;
 --border-radius-md: 8px;
 --border-radius-lg: 12px;
 --border-radius-xl: 16px;
 --transition-fast: 0.15s ease-in-out;
 --transition-normal: 0.25s ease-in-out;
}

/* ============================================
 * RESET
 * ============================================
 */

* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: var(--font-family);
}

body {
 font-size: 14px;
 line-height: 1.5;
 -webkit-font-smoothing: antialiased;
}

/* Utilidad de esqueleto, no de piel: esconder no es una decision de color. */
.hidden { display: none !important; }

/* ============================================
 * SCROLLBARS
 * ============================================
 * decision Franco 2026-08-30: la regla es GLOBAL y usa el mismo tratamiento que .shell-scroll
 * -- navy a baja alpha sobre track transparente. Antes el pulgar era #CBD5E1 y el track
 * var(--bg-main) (#eff2f9), los dos de la generacion anterior, y aplicaban a TODO contenedor con
 * scroll menos .shell-scroll: la tabla de Conciliacion (.conc-card, overflow-x: auto) mostraba
 * una barra gris que no era de ninguna paleta vigente. Al derivar del navy, cualquier contenedor
 * con overflow que aparezca manana ya nace con la barra correcta y sin regla propia.
 */

::-webkit-scrollbar {
 width: 8px;
 height: 8px;
}

::-webkit-scrollbar-track {
 background: transparent;
}

::-webkit-scrollbar-thumb {
 background: rgba(24, 32, 64, .18);
 border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
 background: rgba(24, 32, 64, .30);
}

</style>
